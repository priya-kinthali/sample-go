name: test-encoding/json/v2

on:
  push:
    branches: [ test-375-fr ]
  workflow_dispatch:
jobs:
  proof:
    runs-on: ubuntu-latest
    # env:
    #   GOEXPERIMENT: jsonv2      # <- the only thing needed
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'  # <- plain downloaded toolchain, not rebuilt
          cache: false
      # - run: go env GOEXPERIMENT          # prints: jsonv2
      - run: |
          cat > main.go <<'EOF'
          package main
          import ( "fmt"; jsonv2 "encoding/json/v2" )
          func main() { b,_ := jsonv2.Marshal(map[string]int{"a":1}); fmt.Println(string(b)) }
          EOF
          go run main.go                  # succeeds -> proves no rebuild needed