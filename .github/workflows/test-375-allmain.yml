name: Test Setup-Go PR 334 Outputs

on:
  push:
    branches: [ test-375-fr ]
  workflow_dispatch:

jobs:
  test-pr:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.20"
          - "1.23"
          - "1.25rc3"
          - "1.25.0"
          - "1.25.2"
          - "1.24rc2"
          - "1.23rc1"
          - "1.23.10"
          - "1.20rc1"
          - "1.20rc2"
          - "1.20rc3"
          - "1.18beta1"
          - "1.18beta2"
          - "1.18.0-rc.1"
          - "1.18.0-beta.1"
          - "1.18-beta.1"
          - "v1.18.0-rc.1"
          - "~1.20"
          - "=1.24"
          - "1.x"
          - "1.20.1 || 1.25.2"
          - "1.20.7 || >=1.21.1 <2.0.0"
          - "1.18.0 - 1.20.7"
          - "stable"
          - "oldstable"
          - ">=1.17.0"
          - "^1.13.1"
          - "v1.23"
          - "v 1.20"
          - "  1.25"

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v5
      - name: Setup-Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - name: Test Go installation
        run: go version