name: Test Go cache

on:
  push:
    branches:
      - test-540
  workflow_dispatch:
    

jobs:
  test-go-version:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24
          check-latest: true
          cache-dependency-path: go.sum
      - name: Verify Go version
        run: go version