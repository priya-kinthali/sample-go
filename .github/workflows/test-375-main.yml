name: Test Setup-Go with main
on:
  push:
    branches: [ test-375-fr ]
  workflow_dispatch:

jobs:
  test-setup-go-pr:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-22.04, windows-latest, windows-11-arm, macos-latest, macos-13]
        # runner: [windows-latest]
      fail-fast: false

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v5
      - name: Setup-Go
        uses: actions/setup-go@v6
        with:
          go-version: 'v1.18.0-rc.1'
          # cache-dependency-path:  'go.sum'
          cache: false

      - name: Test Go installation
        run: go version