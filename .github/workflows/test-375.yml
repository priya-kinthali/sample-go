name: Test Setup-Go PR 334 Outputs

on:
  push:
    branches: [ test-375-fr ]
  workflow_dispatch:

jobs:
  test-setup-go-pr:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-22.04, windows-latest, windows-11-arm, macos-latest, macos-13]
        # runner: [windows-latest]
      fail-fast: false

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v5
      - name: Setup-Go
        uses: priya-kinthali/setup-go@tool-version
        # uses: actions/setup-go@v6
        with:
          # go-version-file: '.tool-versions'
          go-version-file: 'go.mod'
          # cache-dependency-path:  'go.sum'
          # go-version: '1.23'
          # check-latest: true
          cache: false
      - name: Test Go installation
        run: go version