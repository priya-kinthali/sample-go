name: Test partial cache 
on:
  push:
    branches: [ test-375-fr ]
  workflow_dispatch:

jobs:
  test-setup-go-pr:
    strategy:
      matrix:
        # runner: [ubuntu-latest, ubuntu-22.04, windows-latest, windows-11-arm, macos-latest, macos-13]
        runner: [ubuntu-latest]
      fail-fast: false

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v5
      - name: Setup-Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.4'
          cache: false
      - uses: actions/cache@v5
        with:
          path: |
            go.mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Test Go installation
        run: go version
      - name: Install Dependencies
        run: |
          go mod download