name: Test Setup-Go PR 334 Outputs

on:
  push:
    branches: [ test-605 ]
  workflow_dispatch:

jobs:
  test-setup-go-pr:
    strategy:
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-latest]
        # runner: [ubuntu-latest]

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout this repo (your code)
        uses: actions/checkout@v2

      - name: Setup-Go ${{ matrix.runner }}
        id: setup-go
        # uses: lucacome/setup-go@add-env
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: false
      - name: Export GOCACHE
        run: |
          if [[ $RUNNER_OS == 'Windows' ]]; then
            echo "GOCACHE=$(go env GOCACHE | sed 's/\\/\//g')" >> $GITHUB_ENV
          else
            echo "GOCACHE=$(go env GOCACHE)" >> $GITHUB_ENV
      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: ${{ env.GOCACHE }}
          key: go-cache-test-${{ runner.os }}-${{ hashFiles('**/*.mod') }}
          restore-keys: |
            go-cache-${{ runner.os }}

      # - name: Show all setup-go outputs
      #   run: |
      #     echo "go-version: ${{ steps.setup-go.outputs.go-version }}"
      #     echo "go-cache: ${{ steps.setup-go.outputs.go-cache }}"
      #     echo "go-path: ${{ steps.setup-go.outputs.go-path }}"
      #     echo "go-root: ${{ steps.setup-go.outputs.go-root }}"
      #     echo "go-mod: ${{ steps.setup-go.outputs.go-mod }}"
      #     echo "go-mod-cache: ${{ steps.setup-go.outputs.go-mod-cache }}"
      #     echo "go-env: ${{ steps.setup-go.outputs.go-env }}"
      #     echo "cache-hit: ${{ steps.setup-go.outputs.cache-hit }}"