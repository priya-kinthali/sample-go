name: Test Setup-Go PR 334 Outputs

on:
  push:
    branches: [ test-375-fr ]
  workflow_dispatch:

jobs:
  test-setup-go-pr:
    strategy:
      matrix:
        runner: [macos-14, macos-15-intel]
      fail-fast: false

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout this repo (your code)
        uses: actions/checkout@v6

      - name: Setup Go
        uses: ZxillyFork/setup-dotnet@main
        with:
          go-version: '1.19.0'
      - run: go version